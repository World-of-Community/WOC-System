name: Secret Scanning with TruffleHog

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Holt die gesamte Historie, da TruffleHog auch alte Commits scannt

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog-main-action@v3.88.2 # Nutze die aktuelle OSS Action
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified # Überprüft aktiv, ob gefundene Keys noch gültig sind
